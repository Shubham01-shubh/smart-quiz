<!DOCTYPE html>
<html>
<head>
  <title>Take Quiz | Smart Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap core + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root{
      --sq-primary:#2050a0;
      --sq-accent:#148cb4;
      --sq-card-bg:#ffffff;
      --sq-bg-grad:linear-gradient(180deg,#f4f8ff 0%,#f7fafc 100%);
    }
    body{ background: var(--sq-bg-grad); }

    .sq-sticky{
      position: sticky; top: 0; z-index: 1030;
      backdrop-filter: saturate(140%) blur(8px);
      -webkit-backdrop-filter: saturate(140%) blur(8px);
      background: rgba(255,255,255,.95);
      border-bottom: 1px solid rgba(32,80,160,.08);
    }

    .sq-section{ max-width: 900px; margin: 56px auto; padding: 0 16px; }
    .sq-card{
      background: var(--sq-card-bg);
      border-radius: 16px;
      box-shadow: 0 14px 40px rgba(40,69,124,.12);
      padding: 26px 24px;
      animation: fadeInUp .5s ease both;
    }

    .list-group-item{
      border: 0; border-bottom: 1px solid rgba(32,80,160,.08);
      transition: background-color .25s ease;
    }
    .list-group-item:hover{ background: #f7fbff; }

    @keyframes fadeInUp{
      from{ opacity:0; transform: translateY(10px); }
      to{ opacity:1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  {% include 'partials/navbar.html' %}
  {% include 'partials/messages.html' %}

  <!-- Sticky timer + progress -->
  <div class="sq-sticky">
    <div class="container py-2 d-flex justify-content-between align-items-center" style="max-width:900px;">
      <div class="fw-semibold text-primary">
        <i class="bi bi-list-check me-2"></i>{{ attempt.quiz.title }}
      </div>

      <div class="d-flex align-items-center gap-3">
        <div class="text-primary">
          <i class="bi bi-clock me-1"></i><span id="time">--:--</span>
        </div>

        <div class="progress" style="width:220px; height:10px;">
          <div id="prog" class="progress-bar bg-primary" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN BODY - now with data-duration attribute -->
  <div class="sq-section" id="sq-quiz-area" data-duration="{{ attempt.duration_seconds|default:600 }}">
    <div class="sq-card">
      <form method="post" action="{% url 'quiz_submit' attempt.id %}" id="quiz-form">
        {% csrf_token %}

        <ol class="list-group list-group-numbered">
          {% for q in questions %}
          <li class="list-group-item py-3">
            <div class="mb-2">
              <strong>Q{{ forloop.counter }}.</strong> {{ q.question_text }}
            </div>

            {% for opt in q.answers.all %}
            <div class="form-check">
              <input class="form-check-input" type="radio"
                     name="q_{{ q.id }}"
                     id="q{{ q.id }}_{{ opt.id }}"
                     value="{{ opt.id }}" required>
              <label class="form-check-label" for="q{{ q.id }}_{{ opt.id }}">{{ opt.text }}</label>
            </div>
            {% endfor %}
          </li>
          {% endfor %}
        </ol>

        <input type="hidden" name="time_taken" id="id_time_taken" value="0" />

        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-primary" type="submit" id="submit-btn">
            <i class="bi bi-check2-circle me-1"></i>Submit
          </button>
          <a class="btn btn-outline-secondary" href="{% url 'home' %}">
            <i class="bi bi-x-circle me-1"></i>Cancel
          </a>
        </div>
      </form>
    </div>
  </div>


<!-- CLEAN, VALID JAVASCRIPT (no Django braces) -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  // read duration from data attribute
  const container = document.getElementById("sq-quiz-area");
  let total = 600;

  if (container && container.dataset.duration) {
    const num = parseInt(container.dataset.duration, 10);
    if (!isNaN(num) && num > 0) total = num;
  }

  let remaining = total;

  const el = document.getElementById("time");
  const bar = document.getElementById("prog");
  const form = document.getElementById("quiz-form");
  const submitBtn = document.getElementById("submit-btn");
  const hiddenTime = document.getElementById("id_time_taken");

  let submitted = false;

  form.addEventListener("submit", function (e) {
    if (submitted) {
      e.preventDefault();
      return false;
    }
    hiddenTime.value = Math.floor(total - remaining);
    submitted = true;
    submitBtn.disabled = true;
    submitBtn.innerHTML = "Submitting...";
  });

  function render() {
    const m = String(Math.floor(remaining / 60)).padStart(2, "0");
    const s = String(remaining % 60).padStart(2, "0");
    el.textContent = `${m}:${s}`;

    const pct = Math.min(100, Math.max(0, 100 * (1 - remaining / total)));
    bar.style.width = pct + "%";
    bar.setAttribute("aria-valuenow", pct);
  }

  function tick() {
    render();
    if (remaining <= 0) {
      if (!submitted) {
        submitted = true;
        hiddenTime.value = total;
        submitBtn.disabled = true;
        form.submit();
      }
      return;
    }
    remaining -= 1;
  }

  render();
  setInterval(tick, 1000);

});
</script>

</body>
</html>
